name: online-canary

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigiar-online-canary
  cancel-in-progress: false

jobs:
  online-rj-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VIGIAR_RUN_ONLINE_TESTS: true
      VIGIAR_REQUIRE_ONLINE_COMPLETENESS: false
      VIGIAR_ONLINE_REPORT_DIR: data-raw/rj-download-completeness-output/canary-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            local::.
          needs: check

      - name: Run live Power BI integration audit
        run: devtools::test(filter = "online", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Publish online audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rj-online-audit-${{ github.run_id }}
          path: data-raw/rj-download-completeness-output/
          if-no-files-found: warn
          retention-days: 90
