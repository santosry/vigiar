on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly run with online tests enabled so the network code paths are also
    # exercised by coverage.
    - cron: '0 3 * * 0'

name: test-coverage

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VIGIAR_RUN_ONLINE_TESTS: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          # 'covr' measures coverage; 'xml2', 'DT' and 'htmltools' are optional
          # dependencies of covr::to_cobertura() and covr::report().
          extra-packages: |
            any::covr
            any::xml2
            any::DT
            any::htmltools
          needs: coverage

      - name: Test coverage (ratchet)
        run: Rscript .github/coverage-check.R
        shell: bash

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.html
            cobertura.xml
          if-no-files-found: ignore
          retention-days: 14
