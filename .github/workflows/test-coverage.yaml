on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VIGIAR_RUN_ONLINE_TESTS: false
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(type = "none", quiet = FALSE)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("Coverage: %.1f%%\n", pct))
          covr::report(cov, file = "coverage.html")
          if (pct < 50) {
            stop(sprintf("Coverage %.1f%% is below the 50%% threshold.", pct))
          }
        shell: Rscript {0}
